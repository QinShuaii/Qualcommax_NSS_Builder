name: Build

# Builds the edma-nss images for every ipq807x device, in memory-profile groups:
#   check (upstream moved?) -> draft release -> build each group -> publish -> prune
# All build parameters live in the `env:` block below and in devices/<group>/config.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'devices/**'
      - '!devices/common-ppe/**'
      - '!devices/ppe-*/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: a544883434-ui/openwrt-nss-edma
  UPSTREAM_REF: hermes-v12
  NSS_REPO: JuliusBairaktaris/nss-packages
  NSS_REF: edma-nss
  TARGET: qualcommax/ipq807x
  VARIANT: edma-nss
  RELEASE_PREFIX: edma-nss
  KEEP: "2"                     # newest releases to retain, per prefix
  FEEDS: "src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss"

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
    outputs:
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      nss_sha: ${{ steps.check.outputs.nss_sha }}
      need: ${{ steps.check.outputs.need }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: bash scripts/check-updates.sh

  release:
    name: Create draft release
    needs: check
    if: needs.check.outputs.need == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_SHA: ${{ needs.check.outputs.upstream_sha }}
      NSS_SHA: ${{ needs.check.outputs.nss_sha }}
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - id: draft
        run: |
          set -euo pipefail
          date=$(date -u +%F)
          stamp=$(date -u +%Y%m%dT%H%M%SZ)

          # One draft per flavour. The build jobs upload into it; it is
          # published only once every group has succeeded, so a partial image
          # set never goes out.
          draft() {
            local prefix="$1" name="$2" tag
            tag="${prefix}-${stamp}-${GITHUB_RUN_ID}"

            {
              echo "## OpenWrt Build — ${name}"
              echo "- **Date**: $date"
              echo "- **Variant**: \`${name}\`"
              echo "- **Target**: \`${TARGET}\` (every ipq807x device)"
              echo "- **Upstream**: \`${UPSTREAM_REPO}@${UPSTREAM_SHA}\`"
              if [[ -n "${NSS_SHA}" ]]; then
                echo "- **NSS**: \`${NSS_SHA}\`"
              fi
              echo "- **Trigger**: \`${GITHUB_EVENT_NAME}\`"
              echo
              echo "Pick the \`...-<your device>-squashfs-sysupgrade.bin\` asset and flash"
              echo "it over an existing OpenWrt install. These are sysupgrade images only -"
              echo "there is no factory image; install stock OpenWrt first if you are not"
              echo "already running it."
              echo
              echo "The offload comes up at boot; \`nss-status\` reports its health."
              echo "To stay on the plain host stack instead:"
              echo "\`uci set nss.general.enabled='0'; uci commit nss; reboot\`."
            } >release_notes.md

            # stdout is the tag; gh prints the release URL, which would
            # otherwise end up in it.
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "OpenWrt ${name} $date" \
              --notes-file release_notes.md >&2

            printf '%s\n' "$tag"
          }

          {
            echo "tag=$(draft "$RELEASE_PREFIX" "$VARIANT")"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.device }}
    needs: [check, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # One entry per devices/<name>/ directory. The ipq807x-* groups exist
        # because the ath11k memory profile is compile-time and image-wide, so
        # boards can only share a build when they share a profile.
        device: [ipq807x-1g]
    env:
      GH_TOKEN: ${{ github.token }}
      DEVICE: ${{ matrix.device }}
      CONFIG_FRAGMENT: ""
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Restore OpenWrt build cache (dl + staging_dir)
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
            openwrt/build_dir
            openwrt/tmp
          key: openwrt-${{ env.DEVICE }}-${{ github.run_id }}
          restore-keys: |
            openwrt-${{ env.DEVICE }}-
            openwrt-

      - name: Install build dependencies
        run: |
          set -euo pipefail
          # Pinned to the ubuntu-26.04 runner. OpenWrt main builds its own
          # flex/bison/etc. host tools, so the host set is the minimal OpenWrt prerequisite list
          # for Ubuntu 26.04. rsync is for prepare-build.sh's overlay step. Everything else
          # (file, wget, unzip, gh) is preinstalled on the GitHub runner image.
          # The runner image carries third-party apt repos the build has no use for,
          # and their indexes intermittently fail to verify; the install below is
          # the step that has to succeed.
          sudo apt-get update || true
          sudo apt-get install -y \
            bzip2 g++ gawk gcc git glibc-source libncurses-dev make rsync

      - name: Checkout OpenWrt source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.upstream_sha }}
          fetch-depth: 0
          path: openwrt

      - name: Checkout builder repo
        uses: actions/checkout@v7
        with:
          path: builder
          
      - name: Apply Redmi AX6 NOWIFI DTS patch
        working-directory: openwrt
        run: |
          set -euo pipefail
          f=target/linux/qualcommax/dts/ipq8071-ax6-stock.dts
          p="$GITHUB_WORKSPACE/builder/patches/target/0001-redmi-ax6-nowifi-disable-wifi.patch"
          if grep -q '^&wifi {' "$f"; then
            echo "already applied"
          else
            patch -p1 --forward <"$p"
          fi
          grep -A2 '^&wifi {' "$f" | grep -q 'status = "disabled";'
          
      - name: Prepare build environment
        env:
          OPENWRT_DIR: ${{ github.workspace }}/openwrt
          BUILDER_REPO: ${{ github.workspace }}/builder
        run: bash builder/scripts/prepare-build.sh

      - name: Set reproducible-build env
        working-directory: openwrt
        run: |
          set -euo pipefail
          {
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "TZ=UTC"
            echo "LC_ALL=C"
            echo "KBUILD_BUILD_USER=builder"
            echo "KBUILD_BUILD_HOST=github"
          } >>"$GITHUB_ENV"

      - name: Disable TLS verification for source downloads
        run: |
          set -euo pipefail
          echo "CURL_OPTIONS=--insecure" >>"$GITHUB_ENV"
          echo "WGET_OPTIONS=--no-check-certificate" >>"$GITHUB_ENV"
          echo "TLS verification disabled (GitHub runner CA/time issue with openwrt mirrors)"

      - name: Pre-fetch known-flaky source tarballs
        working-directory: openwrt
        run: |
          set -euo pipefail
          mkdir -p dl
          # findutils 4.10.0: openwrt CDN intermittently 404s for GitHub runner IPs.
          # Pre-fetch from GNU mirrors (multiple fallbacks) so make download skips it.
          if [ ! -f dl/findutils-4.10.0.tar.xz ]; then
            for url in \
              "https://ftpmirror.gnu.org/findutils/findutils-4.10.0.tar.xz" \
              "https://mirror.netcologne.de/gnu/findutils/findutils-4.10.0.tar.xz" \
              "https://sources.cdn.openwrt.org/findutils-4.10.0.tar.xz"; do
              echo "trying $url"
              if curl -fsSL --connect-timeout 10 --retry 3 --insecure -o dl/findutils-4.10.0.tar.xz "$url"; then
                echo "fetched findutils from $url"
                break
              fi
            done
          fi
          ls -la dl/findutils-4.10.0.tar.xz 2>/dev/null || echo "WARN: findutils still missing (will retry in make download)"

      - name: Download sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            make download -j"$(nproc)" V=s && break
            echo "Download attempt $attempt failed; retrying..."
            sleep 5
          done

      - name: Build
        working-directory: openwrt
        run: |
          set -euo pipefail
          # V=sc + BUILD_LOG=1: every subsystem logs to logs/<dir>/ even on
          # success, and a failure is captured with the command output that
          # caused it. Without these, a failed image step prints nothing but
          # "ERROR: target/linux failed to build."
          if ! make -j"$(nproc)" V=sc BUILD_LOG=1; then
            echo "::warning::parallel build failed; retrying the failing part serially with V=s"
            make -j1 V=s BUILD_LOG=1
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.DEVICE }}
          path: |
            openwrt/logs/
            openwrt/.config
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload images
        run: |
          set -euo pipefail
          out="openwrt/bin/targets/${TARGET}"

          # Sysupgrade images only - no factory/initramfs, per the project's
          # sysupgrade-from-existing-OpenWrt model. Image names carry the
          # device, so the four groups never collide in the release. The build
          # metadata does, so it is uploaded under the group name instead of
          # dropped - it is the answer to "what exactly was in this image".
          mapfile -t assets < <(find "$out" -maxdepth 1 -type f \( -name 'openwrt-*-squashfs-sysupgrade.bin' -o -name 'openwrt-*-squashfs-factory.ubi' \))
          [[ ${#assets[@]} -gt 0 ]] || { echo "::error::no sysupgrade/factory images in $out"; exit 1; }
          grep -E 'sysupgrade.bin|factory.ubi' "$out/sha256sums" >"sha256sums-${DEVICE}.txt"
          cp "$out/config.buildinfo" "config-${DEVICE}.buildinfo"

          # --clobber, so re-running a job that died mid-upload is a recovery
          # and not a permanent "asset already exists".
          for attempt in 1 2 3; do
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" --clobber \
              "${assets[@]}" "sha256sums-${DEVICE}.txt" "config-${DEVICE}.buildinfo" && break
            [[ $attempt -lt 3 ]] || { echo "::error::upload failed after $attempt attempts"; exit 1; }
            echo "::warning::upload attempt $attempt failed; retrying"
            sleep 15
          done

          {
            echo "## ${DEVICE}"
            echo "- assets: ${#assets[@]}"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Save OpenWrt build cache (dl + staging_dir)
        # always(): saving after a failed build is the point - the next run
        # resumes incrementally from the failed tree instead of cold-building.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
            openwrt/build_dir
            openwrt/tmp
          key: openwrt-${{ env.DEVICE }}-${{ github.run_id }}

  publish:
    name: Publish release
    needs: [release, build]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Publish or discard
        run: |
          set -euo pipefail
          if [[ "$BUILD_RESULT" != "success" ]]; then
            # A half-built release would silently be missing devices, and a
            # draft left behind is never pruned. Drop it and fail. No
            # --cleanup-tag: a draft's tag exists only inside the release.
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "::error::a build group failed ($BUILD_RESULT); draft release discarded"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  prune:
    name: Prune old releases
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Prune
        run: |
          set -euo pipefail
          # Per prefix: the two flavours are separate series, and a shared keep
          # window would drop one flavour's newest image to hold the other's.
          PREFIX="$RELEASE_PREFIX" bash scripts/prune-releases.sh
